server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: portfolio-backend

  datasource:
    url: ${jdbc:postgresql://ep-ancient-tooth-b3mtch2l-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_SerB3JD5GyvH&sslmode=require&channelBinding=require}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: PortfolioHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 20MB

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# App Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}

  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size-bytes: 15728640 # 15MB
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/svg+xml
      - image/gif
      - application/pdf

  mail:
    from: ${APP_MAIL_FROM:no-reply@portfolio.com}
    notify-to: ${APP_MAIL_NOTIFY_TO:admin@portfolio.com}

management:
  health:
    mail:
      enabled: false